<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101b26">
  <title>Garage Gauntlet · Railway Rush</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #101b26; color: #f4f4e3; font: 16px system-ui, sans-serif;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
    #loading { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(ellipse at 50% 95%, #234349, transparent 65%), #101b26; }
    #loading[hidden] { display: none; }
    .grid { width: min(100%, 34rem); padding: clamp(20px, 6vw, 46px); border-top: 3px solid #67eccb; background: #101b26;
      box-shadow: 0 24px 90px #080f1590; }
    .grid span { letter-spacing: .16em; color: #67eccb; font-weight: 800; font-size: .74rem; }
    .grid h1 { margin: .16em 0 .35em; font-size: clamp(42px, 9vw, 74px); line-height: .96; letter-spacing: -.065em; }
    .grid p { color: #bac6cb; }
    progress { width: 100%; accent-color: #67eccb; height: 7px; }
  </style>
</head>
<body>
  <canvas id="race" tabindex="0" aria-label="Railway Rush slot-car racing game"></canvas>
  <section id="loading" role="status">
    <div class="grid">
      <span>GARAGE GAUNTLET / 01</span>
      <h1>Railway<br>Rush</h1>
      <p id="message">Powering up the four-lane slot track…</p>
      <progress id="progress" aria-label="Game loading" value="0" max="1"></progress>
    </div>
  </section>
  <script src="Build/74791ae957a7b866143750eb75d765b9.loader.js"></script>
  <script>
    const canvas = document.querySelector("#race");
    const loading = document.querySelector("#loading");
    const progress = document.querySelector("#progress");
    const message = document.querySelector("#message");

    async function loadRace() {
      try {
        await createUnityInstance(canvas, {
          dataUrl: "Build/2e8727066b8ecfa30715352fa8e2dc64.data.unityweb",
          frameworkUrl: "Build/bfb9966b2c65fcfc594f1d064558da25.framework.js.unityweb",
          codeUrl: "Build/61e3c288c257c15ca70a54a7cde41d96.wasm.unityweb",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "Garage Gauntlet",
          productName: "Railway Rush",
          productVersion: "1.0",
          devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5)
        }, value => { progress.value = value; });
        loading.hidden = true;
        canvas.focus();
      } catch (error) {
        progress.hidden = true;
        message.textContent = "The game could not load. Check that your browser supports WebGL 2 and reload.";
        console.error(error);
      }
    }

    loadRace();
  </script>
</body>
</html>
