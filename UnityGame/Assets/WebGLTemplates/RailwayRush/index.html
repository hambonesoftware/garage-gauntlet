<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15272c">
  <title>Garage Gauntlet · Railway Rush</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #15272c; color: #fff5db; font: 16px system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
    #loading { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; padding: 24px; }
    #loading[hidden] { display: none; }
    #loading span { letter-spacing: .16em; color: #ffc971; font-weight: bold; }
    #loading h1 { margin: .2em 0 .5em; font-size: clamp(36px, 9vw, 66px); }
    progress { width: 100%; accent-color: #ffc971; }
  </style>
</head>
<body>
  <canvas id="race" tabindex="0" aria-label="Railway Rush RC racing game"></canvas>
  <section id="loading" role="status">
    <span>GARAGE GAUNTLET</span>
    <h1>Railway Rush</h1>
    <p id="message">Setting up the model railway…</p>
    <progress id="progress" aria-label="Game loading" value="0" max="1"></progress>
  </section>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    const canvas = document.querySelector("#race");
    const loading = document.querySelector("#loading");
    const progress = document.querySelector("#progress");
    const message = document.querySelector("#message");

    async function loadRace() {
      try {
        await createUnityInstance(canvas, {
          dataUrl: "Build/{{{ DATA_FILENAME }}}",
          frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
          codeUrl: "Build/{{{ CODE_FILENAME }}}",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "Garage Gauntlet",
          productName: "Railway Rush",
          productVersion: "{{{ PRODUCT_VERSION }}}",
          devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5)
        }, value => { progress.value = value; });
        loading.hidden = true;
        canvas.focus();
      } catch (error) {
        progress.hidden = true;
        message.textContent = "The game could not load. Check that your browser supports WebGL 2 and reload.";
        console.error(error);
      }
    }

    loadRace();
  </script>
</body>
</html>
